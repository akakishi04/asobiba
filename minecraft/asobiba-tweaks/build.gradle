plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Keep the standalone runner separate from JUnit discovery; both checks remain strict.
sourceSets {
    cloudStateTest {
        java.srcDir 'src/cloudStateTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
// Pure cosmetic-state regression, also run by the normal local/CI build.
var verifyCloudLineState = tasks.register('verifyCloudLineState', JavaExec) {
    dependsOn tasks.named('cloudStateTestClasses')
    classpath = sourceSets.cloudStateTest.runtimeClasspath
    mainClass = 'io.github.akakishi04.asobibatweaks.feature.CloudLineStateTest'
}
tasks.named('check') { dependsOn verifyCloudLineState }

var verifyDailyPlayTimeHudState = tasks.register('verifyDailyPlayTimeHudState', JavaExec) {
    dependsOn tasks.named('cloudStateTestClasses')
    classpath = sourceSets.cloudStateTest.runtimeClasspath
    mainClass = 'io.github.akakishi04.asobibatweaks.feature.DailyPlayTimeHudStateTest'
}
tasks.named('check') { dependsOn verifyDailyPlayTimeHudState }

var verifyDailyPlayTimeLedger = tasks.register('verifyDailyPlayTimeLedger', JavaExec) {
    dependsOn tasks.named('cloudStateTestClasses')
    classpath = sourceSets.cloudStateTest.runtimeClasspath
    mainClass = 'io.github.akakishi04.asobibatweaks.feature.DailyPlayTimeLedgerTest'
}
tasks.named('check') { dependsOn verifyDailyPlayTimeLedger }
