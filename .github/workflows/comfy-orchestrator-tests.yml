name: Comfy Orchestrator checks

on:
  push:
    paths:
      - "comfy-orchestrator/**"
      - ".github/workflows/comfy-orchestrator-tests.yml"
  pull_request:
    paths:
      - "comfy-orchestrator/**"
      - ".github/workflows/comfy-orchestrator-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media test dependencies
        shell: pwsh
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:Path = "$env:ChocolateyInstall\bin;$env:Path"
            "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          Get-Command ffmpeg,ffprobe -ErrorAction Stop
          python -c "import PIL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and test (no running LM Studio or ComfyUI needed)
        shell: pwsh
        run: |
          Set-Location comfy-orchestrator
          python -m compileall -q comfy_orchestrator
          python -m unittest discover -s tests -v -p "test_*.py"
